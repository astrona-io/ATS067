# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Fence Two Applications With An AppProject (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-067-lab-040-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
      - alpine/git:2.52.0

bootstrap:
  init:
    - name: install-gitea
      description: Start Gitea and create the admin user
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: Install Argo CD
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed-cluster
      description: Seed the repository and create the two Applications
      type: file
      source: bootstrap/03-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: workloads-running
      description: Gitea, Argo CD, both Applications and the workload exist
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete the Applications. Change the project and the Applications only.
    - name: project-defined
      description: The AppProject crew allows one repository, one destination and no cluster-scoped kinds
      type: file
      source: validation/validate-project-defined.sh
      hint: Set sourceRepos to the one repository URL, one destination for starfleet and an empty clusterResourceWhitelist.
    - name: scout-in-project
      description: scout is in crew and is Synced and Healthy
      type: file
      source: validation/validate-scout-in-project.sh
      hint: Patch spec.project of the Application scout to crew.
    - name: intruder-blocked
      description: intruder is in crew and the project refuses its destination
      type: file
      source: validation/validate-intruder-blocked.sh
      hint: Patch spec.project of intruder to crew and leave its destination unchanged. Request a hard refresh and read status.conditions.

teardown:
  keepCluster: false
