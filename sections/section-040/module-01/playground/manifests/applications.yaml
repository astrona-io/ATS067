apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: scout
  namespace: argocd
spec:
  project: crew
  source:
    repoURL: http://gitea-http.gitea.svc:3000/starfleet/fleet-config.git
    targetRevision: main
    path: apps/scout
  destination:
    server: https://kubernetes.default.svc
    namespace: starfleet
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: outsider
  namespace: argocd
spec:
  project: crew
  source:
    repoURL: http://gitea-http.gitea.svc:3000/starfleet/fleet-config.git
    targetRevision: main
    path: apps/intruder
  destination:
    server: https://kubernetes.default.svc
    namespace: vault
  syncPolicy:
    automated: {}
    syncOptions:
      - CreateNamespace=true
