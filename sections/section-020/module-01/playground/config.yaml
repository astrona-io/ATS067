# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Canary Steps And Blue-Green With Argo Rollouts (PLAYGROUND): a clean sandbox. It installs the Argo Rollouts controller and starts a canary Rollout and a blue-green Rollout at version 1. No task, no grading. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-067-playground-020-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - quay.io/argoproj/argo-rollouts:v1.10.0

bootstrap:
  init:
    - name: install-rollouts
      description: Install the Argo Rollouts controller
      type: file
      source: bootstrap/01-install-rollouts.sh
    - name: start-playground
      description: Create the Rollouts scout and shield
      type: file
      source: bootstrap/02-start-playground.sh

teardown:
  keepCluster: false
