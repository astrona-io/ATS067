# Playground starting state: go-httpbin in analysis, the template quality-gate and a canary Rollout scout at version 1.
---
apiVersion: v1
kind: Namespace
metadata:
  name: analysis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: analysis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
  template:
    metadata:
      labels:
        app: httpbin
    spec:
      containers:
        - name: httpbin
          image: mccutchen/go-httpbin:2.25.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /status/200
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: httpbin
  namespace: analysis
spec:
  selector:
    app: httpbin
  ports:
    - name: http
      port: 8080
      targetPort: http
apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: quality-gate
  namespace: starfleet
spec:
  args:
    - name: score
  metrics:
    - name: quality
      interval: 10s
      count: 3
      failureLimit: 0
      successCondition: asInt(result) >= 90
      provider:
        web:
          url: "http://httpbin.analysis.svc.cluster.local:8080/get?score={{ args.score }}"
          jsonPath: "{$.args.score[0]}"
---
apiVersion: v1
kind: Service
metadata:
  name: scout-stable
  namespace: starfleet
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: scout-canary
  namespace: starfleet
spec:
  selector:
    app: scout
  ports:
    - name: http
      port: 9898
      targetPort: http
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: scout
  namespace: starfleet
spec:
  replicas: 4
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: scout
  template:
    metadata:
      labels:
        app: scout
    spec:
      containers:
        - name: scout
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          env:
            - name: PODINFO_UI_MESSAGE
              value: version-1
          ports:
            - name: http
              containerPort: 9898
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 64Mi
  strategy:
    canary:
      stableService: scout-stable
      canaryService: scout-canary
      steps:
        - setWeight: 25
        - pause: {duration: 20s}
        - setWeight: 50
        - pause: {duration: 20s}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shuttle
  namespace: starfleet
  labels:
    app: shuttle
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shuttle
  template:
    metadata:
      labels:
        app: shuttle
    spec:
      containers:
        - name: shuttle
          image: curlimages/curl:8.22.0
          command: ["sh", "-c", "while true; do sleep 30; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
