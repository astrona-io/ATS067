# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Reconcile From Git And Trigger From An Event (CAPSTONE). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-067-capstone-030
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
      - alpine/git:2.52.0
      - quay.io/argoproj/argo-events:v1.9.11
      - nats:2.10.29
      - natsio/prometheus-nats-exporter:0.14.0
      - natsio/nats-server-config-reloader:0.14.0

bootstrap:
  init:
    - name: install-gitea
      description: Start Gitea and create the admin user
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: Install Argo CD
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: install-argo-events
      description: Install Argo Events and the EventBus
      type: file
      source: bootstrap/03-install-argo-events.sh
    - name: seed-cluster
      description: Seed the repository, sync once and create the drift
      type: file
      source: bootstrap/04-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: workloads-running
      description: Gitea, Argo CD, Argo Events, the client and deploy-state exist
      type: file
      source: validation/validate-workloads-running.sh
      hint: Do not delete the Application, the EventBus or deploy-state.
    - name: drift-healed
      description: Self-heal and prune are on and the live replicas equal Git
      type: file
      source: validation/validate-drift-healed.sh
      hint: Patch spec.syncPolicy.automated with prune and selfHeal set to true.
    - name: git-release-applied
      description: main sets version-2 and the cluster is reconciled to the head of main
      type: file
      source: validation/validate-git-release-applied.sh
      hint: Commit the new message to main in starfleet/fleet-config and wait for the Application to be Synced.
    - name: event-path-defined
      description: The EventSource ref-hook and the Sensor ref-sensor patch deploy-state
      type: file
      source: validation/validate-event-path-defined.sh
      hint: Define the webhook entry release on /release, the dependency, the ServiceAccount sensor-runner and a patch trigger.
    - name: event-recorded
      description: deploy-state holds scout and the head commit of main
      type: file
      source: validation/validate-event-recorded.sh
      hint: Send the event with the head commit hash as ref from the client pod.

teardown:
  keepCluster: false
