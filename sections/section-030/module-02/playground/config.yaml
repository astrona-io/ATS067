# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Event-Driven Triggers With Argo Events (PLAYGROUND): Argo Events with a webhook EventSource, a Sensor and a curl client. No task, no grading. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-067-playground-030-02
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - quay.io/argoproj/argo-events:v1.9.11
      - nats:2.10.29
      - natsio/prometheus-nats-exporter:0.14.0
      - natsio/nats-server-config-reloader:0.14.0

bootstrap:
  init:
    - name: install-argo-events
      description: Install Argo Events and the EventBus
      type: file
      source: bootstrap/03-install-argo-events.sh
    - name: start-playground
      description: Create the EventSource, the Sensor and the client
      type: file
      source: bootstrap/02-start-playground.sh

teardown:
  keepCluster: false
