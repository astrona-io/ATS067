# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Make Git The Only Way To Change An Application (LAB). Graded against the live cluster. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-067-lab-030-01
  docs:
    prerequisites: prerequisites.md
    question: question.md
    solution: solution.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
      - alpine/git:2.52.0

bootstrap:
  init:
    - name: install-gitea
      description: Start Gitea and create the admin user
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: Install Argo CD
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: seed-cluster
      description: Seed the repository and create the Application
      type: file
      source: bootstrap/03-seed-cluster.sh

# Applied only by `astrona test`: the reference solution.
testing:
  init:
    - name: apply-solution
      description: Apply the reference solution
      type: file
      source: solution/apply.sh

validation:
  scripts:
    - name: workloads-running
      description: Gitea, Argo CD, the Application scout and the Deployment exist
      type: file
      source: validation/validate-workloads-running.sh
      hint: Change the Application and the repository only. Do not delete the Application.
    - name: sync-policy
      description: The Application has automated sync with prune and self-heal
      type: file
      source: validation/validate-sync-policy.sh
      hint: Patch spec.syncPolicy.automated with prune and selfHeal set to true.
    - name: git-change-applied
      description: main holds 3 replicas and no old-flags.yaml, and the cluster is reconciled to that commit
      type: file
      source: validation/validate-git-change-applied.sh
      hint: Commit both changes to main in the repository starfleet/fleet-config and wait for the Application to be Synced.
    - name: sync-record
      description: The ConfigMap sync-record matches the Application revision and the live replicas
      type: file
      source: validation/validate-sync-record.sh
      hint: Read status.sync.revision of the Application and the replicas of the Deployment.

teardown:
  keepCluster: false
