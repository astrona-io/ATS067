# yaml-language-server: $schema=https://cli.astrona.io/schema/lab-config.schema.json
#
# Pull-Based Reconciliation With Argo CD (PLAYGROUND): Gitea as the Git repository, Argo CD and one Application. No task, no grading. Built untested.
apiVersion: astrona.io/v1
metadata:
  name: ats-067-playground-030-01
  docs:
    guide: docs/overview.md

runtime:
  type: kind
  kind:
    image: kindest/node:v1.35.8
    preloadImages:
      - ghcr.io/stefanprodan/podinfo:6.15.0
      - ghcr.io/stefanprodan/podinfo:6.14.0
      - mccutchen/go-httpbin:2.25.0
      - curlimages/curl:8.22.0
      - gitea/gitea:28.1.0-rootless
      - quay.io/argoproj/argocd:v3.5.4
      - public.ecr.aws/docker/library/redis:8.2.3-alpine
      - alpine/git:2.52.0

bootstrap:
  init:
    - name: install-gitea
      description: Start Gitea and create the admin user
      type: file
      source: bootstrap/01-install-gitea.sh
    - name: install-argocd
      description: Install Argo CD
      type: file
      source: bootstrap/02-install-argocd.sh
    - name: start-playground
      description: Seed the repository and create the Application
      type: file
      source: bootstrap/03-start-playground.sh

teardown:
  keepCluster: false
