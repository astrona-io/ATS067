# Course manifest for ATS067. Each section lists its README, modules (landing, parts, lab Question reading and lab entry after the last part, summary), a capstone and a quiz.
training:
  id: ATS067
  title: 'CGOA: GitOps Patterns'
  description: Concept lessons, playgrounds, graded labs, capstones and original scenario quizzes covering every published objective in this CGOA domain. Labs run on kind (Kubernetes 1.35).
  certification:
    name: Certified GitOps Associate
    code: CGOA
    provider: CNCF / Linux Foundation
    domain: GitOps Patterns
    weight: 20
    competencies:
    - Deployment and Release Patterns
    - Progressive Delivery Patterns
    - Pull vs. Event-driven
    - Architecture Patterns (in-cluster and external reconciler, state store management, etc.)
modules:
  - id: module-intro
    title: Introduction
    description: Audience, learning approach, tools to install and contribution process.
    content:
    - type: reading
      title: "Introduction"
      path: sections/intro/README.md
    - type: reading
      title: "Welcome To The Course"
      path: sections/intro/course-01-welcome.md
    - type: reading
      title: "Get Your Machine Ready"
      path: sections/intro/course-02-get-your-machine-ready.md
    - type: reading
      title: "How This Course Is Made"
      path: sections/intro/course-03-how-this-course-is-made.md
