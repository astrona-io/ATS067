- id: section-020
  title: Progressive Delivery Patterns
  curriculum_item: Progressive Delivery Patterns
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Canary Steps And Blue-Green Service Switching
    objectives:
    - Compare incremental canary exposure with blue-green promotion.
    - Explain stable, canary, active and preview Service relationships.
    - Relate pauses, weights and scale to actual request distribution.
    - Evaluate capacity, connection persistence and abort behavior.
    - Distinguish reusable analysis definitions from individual executions.
    - Explain metric providers, arguments and success or failure conditions.
    - Interpret missing data, errors and inconclusive results.
    - Relate analysis placement and limits to promotion behavior.
    outline:
    - Canary Steps And Blue-Green Service Switching
    - AnalysisTemplate Measurements And AnalysisRun Decisions
    playground: false
    module_lab: false
    sources:
    - reading: sections/section-020/module-01/course-01-canary-steps-and-blue-green-service-switching.md
      adapted_from: ATS062/sections/section-020/module-01/course-01-canary-steps-and-blue-green-service-switching.md
    - reading: sections/section-020/module-01/course-02-analysistemplate-measurements-and-analysisrun-decisions.md
      adapted_from: ATS062/sections/section-030/module-01/course-01-analysistemplate-measurements-and-analysisrun-decisions.md
- id: section-030
  title: Pull vs. Event-driven
  curriculum_item: Pull vs. Event-driven
  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Event-Driven Triggers And Safe Repeated Actions
    objectives:
    - Explain why external events can initiate Kubernetes work.
    - Distinguish event ingestion from task execution.
    - Define dependency filters and trigger input mapping.
    - Evaluate authentication, retries and idempotent side effects.
    - Distinguish an event hint for authoritative retrieval from a one-time pushed deployment.
    outline:
    - Event-Driven Triggers And Safe Repeated Actions
    playground: false
    module_lab: false
    sources:
